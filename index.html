<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Личный кабинет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #0f0f0f);
    --text: var(--tg-theme-text-color, #ffffff);
    --hint: var(--tg-theme-hint-color, #999999);
    --button: var(--tg-theme-button-color, #2ea6ff);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #1c1c1e);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .announcement {
    background: linear-gradient(135deg, #ff9500, #ff5e3a);
    color: white;
    padding: 14px 16px;
    border-radius: 14px;
    margin-bottom: 16px;
    font-size: 15px;
    line-height: 1.4;
    display: none;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .name {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .label {
    color: var(--hint);
    font-size: 13px;
    margin-top: 14px;
  }
  .value {
    font-size: 17px;
    font-weight: 500;
    margin-top: 2px;
  }
  .status-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    margin-top: 6px;
  }
  .status-active { background: #34c75933; color: #34c759; }
  .status-overdue { background: #ff3b3033; color: #ff3b30; }
  .status-none { background: #8e8e9333; color: #8e8e93; }
  .empty {
    text-align: center;
    color: var(--hint);
    padding: 40px 20px;
  }
  .loading {
    text-align: center;
    color: var(--hint);
    padding: 40px 20px;
  }
</style>
</head>
<body>

<div id="announcement" class="announcement"></div>
<div id="content" class="loading">Загрузка…</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  async function load() {
    const initData = tg.initData || "";
    try {
      const res = await fetch("/api/me?initData=" + encodeURIComponent(initData));
      const data = await res.json();
      render(data);
    } catch (e) {
      document.getElementById("content").innerHTML =
        '<div class="empty">Не удалось загрузить данные. Попробуйте позже.</div>';
    }
  }

  function render(data) {
    const content = document.getElementById("content");
    const ann = document.getElementById("announcement");

    if (data.announcement) {
      ann.textContent = data.announcement;
      ann.style.display = "block";
    }

    if (!data.registered) {
      content.innerHTML = '<div class="empty">Похоже, вы ещё не зарегистрированы.<br>Напишите боту /start в чате.</div>';
      return;
    }

    let subHtml;
    if (data.subscription) {
      const s = data.subscription;
      let visitsHtml = "";
      if (s.visits_total !== null && s.visits_total !== undefined) {
        visitsHtml = `
          <div class="label">Осталось посещений</div>
          <div class="value">${s.visits_left} из ${s.visits_total}</div>
        `;
      }
      subHtml = `
        <div class="label">Абонемент</div>
        <div class="value">${s.title}</div>
        <div class="label">Действует до</div>
        <div class="value">${s.end_date}</div>
        ${visitsHtml}
      `;
    } else {
      subHtml = `<div class="label">Абонемент</div>
        <div class="status-badge status-none">Нет активного абонемента</div>`;
    }

    content.innerHTML = `
      <div class="card">
        <div class="name">${data.full_name}</div>
        ${subHtml}
      </div>
    `;
  }

  load();
</script>

</body>
</html>
