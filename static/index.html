<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universal Jiu-Jitsu Batumi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0A0A0A;
    --paper: #161616;
    --paper-line: #2B2B2B;
    --red: #A31515;
    --red-bright: #D01F1F;
    --bone: #F5F3EE;
    --ash: #8C8C86;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 18px 16px 32px;
    background: var(--ink);
    color: var(--bone);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .display {
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 0.03em;
  }
  .team-banner {
    text-align: center;
    padding-bottom: 16px;
    margin-bottom: 6px;
  }
  .team-banner .club {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 0.06em;
    line-height: 1.1;
  }
  .team-banner .city {
    color: var(--red-bright);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 0.06em;
  }
  .team-banner .bar {
    width: 46px;
    height: 3px;
    background: var(--red);
    margin: 8px auto 0;
  }
  .announcement {
    background: var(--red);
    color: var(--bone);
    padding: 13px 16px;
    margin-bottom: 18px;
    font-size: 14px;
    line-height: 1.4;
    font-weight: 500;
    display: none;
    border-radius: 3px;
  }
  .card {
    background: var(--paper);
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    padding: 20px;
    margin-bottom: 14px;
  }
  .id-card {
    border-left: 4px solid var(--red);
    animation: rise 0.35s ease-out;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .id-card { animation: none; }
  }
  .name {
    font-family: 'Oswald', sans-serif;
    font-size: 25px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    line-height: 1.15;
    margin-bottom: 8px;
  }
  .group-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px 3px 9px;
    border: 1px solid var(--paper-line);
    border-radius: 20px;
    font-size: 12px;
    color: var(--ash);
    font-weight: 600;
  }
  .label {
    color: var(--ash);
    font-size: 13px;
    margin-top: 16px;
  }
  .value {
    font-size: 17px;
    font-weight: 600;
    margin-top: 3px;
  }
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 3px;
    font-size: 13px;
    font-weight: 600;
    margin-top: 8px;
  }
  .status-badge::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  .status-active { background: rgba(245,243,238,0.1); color: var(--bone); }
  .status-overdue { background: rgba(208,31,31,0.18); color: var(--red-bright); }
  .status-none { background: rgba(140,140,134,0.18); color: var(--ash); }
  .empty {
    text-align: center;
    color: var(--ash);
    padding: 50px 20px;
    font-size: 14px;
    line-height: 1.5;
  }
  .loading {
    text-align: center;
    color: var(--ash);
    padding: 50px 20px;
    font-size: 14px;
  }
  button.secondary {
    width: 100%;
    padding: 13px;
    border: 1px solid var(--paper-line);
    border-radius: 3px;
    background: transparent;
    color: var(--bone);
    font-size: 14px;
    font-weight: 600;
    margin-top: 18px;
    letter-spacing: 0.02em;
  }
  button.secondary:active { background: var(--paper-line); }
  .modal-bg {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    align-items: flex-end;
    justify-content: center;
    z-index: 10;
  }
  .modal {
    background: var(--paper);
    border-top: 2px solid var(--red);
    width: 100%;
    max-width: 480px;
    border-radius: 10px 10px 0 0;
    padding: 22px 20px;
  }
  input {
    width: 100%;
    padding: 11px 12px;
    border-radius: 3px;
    border: 1px solid var(--paper-line);
    background: var(--ink);
    color: var(--bone);
    font-size: 15px;
    margin-top: 6px;
  }
  input:focus { outline: none; border-color: var(--red-bright); }
  .group-choice {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }
  .group-btn {
    flex: 1;
    text-align: center;
    padding: 18px 8px;
    border-radius: 4px;
    background: var(--ink);
    border: 1px solid var(--paper-line);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .group-btn.selected { border-color: var(--red-bright); color: var(--red-bright); }
  input[type="date"] {
    -webkit-appearance: none;
    appearance: none;
    text-align: left;
    line-height: normal;
  }
  input[type="date"]::-webkit-date-and-time-value {
    text-align: left;
  }
  button.primary-full {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 3px;
    background: var(--red);
    color: var(--bone);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.03em;
    margin-top: 20px;
  }
  button.primary-full:active { background: #7F1010; }
  button.outline-full {
    width: 100%;
    padding: 14px;
    border: 1px solid var(--red);
    border-radius: 3px;
    background: transparent;
    color: var(--red-bright);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.03em;
    margin-top: 12px;
  }
  button.outline-full:active { background: rgba(163,21,21,0.1); }
  .lang-switch {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    margin-bottom: 14px;
  }
  .lang-btn {
    padding: 5px 11px;
    border-radius: 3px;
    border: 1px solid var(--paper-line);
    background: transparent;
    color: var(--ash);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.03em;
  }
  .lang-btn.active { background: var(--red); color: var(--bone); border-color: var(--red); }
  .footer-links {
    display: flex;
    justify-content: center;
    gap: 22px;
    margin-top: 30px;
  }
  .footer-links a {
    color: var(--ash);
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border: 1px solid var(--paper-line);
    border-radius: 3px;
  }
  .footer-links a:active { border-color: var(--red); color: var(--red-bright); }
  .footer-links svg { width: 19px; height: 19px; fill: currentColor; }
  .section-title {
    font-family: 'Oswald', sans-serif;
    font-size: 15px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ash);
    margin: 24px 0 10px;
  }
  .sched-day {
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--red-bright);
    margin-top: 14px;
    margin-bottom: 6px;
  }
  .sched-row {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 7px 0;
    border-bottom: 1px solid var(--paper-line);
  }
  .sched-row:last-child { border-bottom: none; }
  .sched-time {
    font-family: 'Oswald', sans-serif;
    font-size: 15px;
    font-weight: 600;
    min-width: 92px;
  }
  .sched-title { font-size: 14px; flex: 1; }
  .sched-tag { font-size: 11px; color: var(--ash); }
  .today-row { color: var(--bone); }
  .today-row .sched-time { color: var(--red-bright); }
  .stat-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-top: 4px;
  }
  .stat-big {
    font-family: 'Oswald', sans-serif;
    font-size: 32px;
    font-weight: 700;
    line-height: 1;
  }
  .belt-bar {
    height: 16px;
    border-radius: 2px;
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 6px;
    gap: 3px;
    border: 1px solid var(--paper-line);
  }
  .belt-stripe {
    width: 3px;
    height: 10px;
    background: var(--bone);
    display: block;
  }
  .visit-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .visit-chip {
    font-size: 12px;
    padding: 3px 8px;
    border: 1px solid var(--paper-line);
    border-radius: 3px;
    color: var(--ash);
  }
</style>
</head>
<body>

<div class="team-banner">
  <div class="club">UNIVERSAL JIU-JITSU</div>
  <div class="city">BATUMI</div>
  <div class="bar"></div>
</div>

<div class="lang-switch">
  <div class="lang-btn" id="langRu" onclick="setLang('ru')">RU</div>
  <div class="lang-btn" id="langEn" onclick="setLang('en')" style="margin-left:6px;">EN</div>
</div>

<div id="announcement" class="announcement"></div>
<div id="content" class="loading">…</div>

<div class="footer-links" id="footerLinks"></div>

<div class="modal-bg" id="freezeModalBg">
  <div class="modal">
    <div class="name" id="freezeModalTitle">Заморозить абонемент</div>
    <div class="label" id="freezeDaysLabelEl">На сколько дней?</div>
    <input id="freezeDays" type="number" min="1" max="90" value="7">
    <button id="freezeSubmitBtn" class="primary-full" onclick="submitFreeze()">Отправить заявку</button>
  </div>
</div>

<div class="modal-bg" id="activateModalBg">
  <div class="modal">
    <div class="name" id="activateModalTitle">Активировать абонемент</div>
    <div class="label" id="activateDateLabelEl">Дата начала</div>
    <input id="activateDate" type="date">
    <button id="activateSubmitBtn" class="primary-full" onclick="submitActivation()">Отправить заявку</button>
  </div>
</div>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    try { tg.ready(); tg.expand(); } catch (e) {}
  }

  const T = {
    ru: {
      loading: "Загрузка…",
      openFromBot: "Откройте эту страницу через кнопку «Открыть личный кабинет» в боте, а не напрямую по ссылке.",
      loadError: "Не удалось загрузить данные. Попробуйте позже.",
      subscription: "Абонемент",
      validUntil: "Действует до",
      visitsLeft: "Осталось посещений",
      noSubscription: "Нет активного абонемента",
      freezeBtn: "Заморозить абонемент",
      activateBtn: "Активировать абонемент",
      registration: "Регистрация",
      chooseGroup: "Выберите группу",
      nameLabel: "Имя и фамилия",
      nameLabelKids: "Имя и фамилия ребёнка",
      namePlaceholder: "Имя Фамилия",
      birthDate: "Дата рождения",
      registerBtn: "Зарегистрироваться",
      chooseGroupAlert: "Выберите группу: Adult или Kids",
      enterNameAlert: "Введите имя и фамилию",
      enterBirthAlert: "Укажите дату рождения",
      registerFail: "Не удалось зарегистрироваться. Попробуйте ещё раз.",
      networkError: "Ошибка сети. Попробуйте позже.",
      freezeTitle: "Заморозить абонемент",
      freezeDaysLabel: "На сколько дней?",
      freezeSubmit: "Отправить заявку",
      freezeSent: "Заявка отправлена тренеру. Ждите подтверждения.",
      freezeFail: "Не удалось отправить заявку. Попробуйте позже.",
      activateTitle: "Активировать абонемент",
      activateDateLabel: "Дата начала",
      activateSubmit: "Отправить заявку",
      activateSent: "Заявка отправлена тренеру. Ждите подтверждения.",
      activateFail: "Не удалось отправить заявку. Попробуйте позже.",
      alreadyPending: "Ваша предыдущая заявка ещё на рассмотрении у тренера.",
      schedule: "Расписание",
      noSchedule: "Расписание пока не заполнено.",
      attendance: "Посещения",
      thisMonth: "в этом месяце",
      visitsWord: "тренировок",
      noVisits: "В этом месяце отметок пока нет.",
      belt: "Пояс",
      noBelt: "Пояс пока не присвоен",
      stripesWord: "полосок",
      lastPromo: "Аттестация",
      days: ["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"],
      of: "из",
    },
    en: {
      loading: "Loading…",
      openFromBot: "Please open this page using the “Open cabinet” button in the bot, not directly by link.",
      loadError: "Couldn't load data. Please try again later.",
      subscription: "Subscription",
      validUntil: "Valid until",
      visitsLeft: "Visits left",
      noSubscription: "No active subscription",
      freezeBtn: "Freeze subscription",
      activateBtn: "Activate subscription",
      registration: "Registration",
      chooseGroup: "Choose a group",
      nameLabel: "First and last name",
      nameLabelKids: "Child's first and last name",
      namePlaceholder: "First name Last name",
      birthDate: "Date of birth",
      registerBtn: "Register",
      chooseGroupAlert: "Please choose a group: Adult or Kids",
      enterNameAlert: "Please enter first and last name",
      enterBirthAlert: "Please enter the date of birth",
      registerFail: "Registration failed. Please try again.",
      networkError: "Network error. Please try again later.",
      freezeTitle: "Freeze subscription",
      freezeDaysLabel: "How many days?",
      freezeSubmit: "Send request",
      freezeSent: "Request sent to your trainer. Awaiting approval.",
      freezeFail: "Couldn't send the request. Please try again later.",
      activateTitle: "Activate subscription",
      activateDateLabel: "Start date",
      activateSubmit: "Send request",
      activateSent: "Request sent to your trainer. Awaiting approval.",
      activateFail: "Couldn't send the request. Please try again later.",
      alreadyPending: "Your previous request is still awaiting the trainer's decision.",
      schedule: "Schedule",
      noSchedule: "The schedule has not been set yet.",
      attendance: "Attendance",
      thisMonth: "this month",
      visitsWord: "sessions",
      noVisits: "No check-ins recorded this month yet.",
      belt: "Belt",
      noBelt: "No belt assigned yet",
      stripesWord: "stripes",
      lastPromo: "Promoted",
      days: ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
      of: "of",
    },
  };

  let lang = localStorage.getItem("gym_lang") || "ru";
  let lastData = null;

  function t(key) {
    return T[lang][key];
  }

  function esc(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function setLang(newLang) {
    lang = newLang;
    localStorage.setItem("gym_lang", lang);
    document.getElementById("langRu").classList.toggle("active", lang === "ru");
    document.getElementById("langEn").classList.toggle("active", lang === "en");
    document.getElementById("freezeModalTitle").textContent = t("freezeTitle");
    document.getElementById("freezeDaysLabelEl").textContent = t("freezeDaysLabel");
    document.getElementById("freezeSubmitBtn").textContent = t("freezeSubmit");
    document.getElementById("activateModalTitle").textContent = t("activateTitle");
    document.getElementById("activateDateLabelEl").textContent = t("activateDateLabel");
    document.getElementById("activateSubmitBtn").textContent = t("activateSubmit");
    if (lastData) {
      render(lastData);
    } else {
      document.getElementById("content").textContent = t("loading");
    }
  }

  const INSTAGRAM_URL = "https://www.instagram.com/brazilianjj_batumi?stkn=eGV3eW5meXh0ZTBp&utm_source=qr";
  const TELEGRAM_KIDS_URL = "https://t.me/+zZSUkSffbrw1YWZi";
  const TELEGRAM_ADULT_URL = "https://t.me/+d0QsYmSk9JozZDZi";

  function openLink(url) {
    if (tg && tg.openLink) {
      tg.openLink(url);
    } else {
      window.open(url, "_blank");
    }
  }

  function renderFooterLinks(groupType) {
    const telegramUrl = groupType === "kids" ? TELEGRAM_KIDS_URL : TELEGRAM_ADULT_URL;
    document.getElementById("footerLinks").innerHTML = `
      <a onclick="openLink('${INSTAGRAM_URL}')">
        <svg viewBox="0 0 24 24"><path d="M12 2c2.7 0 3.06.01 4.12.06 1.06.05 1.79.22 2.43.47.66.26 1.21.6 1.76 1.15.55.55.89 1.1 1.15 1.76.25.64.42 1.37.47 2.43.05 1.06.06 1.42.06 4.12s-.01 3.06-.06 4.12c-.05 1.06-.22 1.79-.47 2.43a4.9 4.9 0 0 1-1.15 1.76 4.9 4.9 0 0 1-1.76 1.15c-.64.25-1.37.42-2.43.47-1.06.05-1.42.06-4.12.06s-3.06-.01-4.12-.06c-1.06-.05-1.79-.22-2.43-.47a4.9 4.9 0 0 1-1.76-1.15 4.9 4.9 0 0 1-1.15-1.76c-.25-.64-.42-1.37-.47-2.43C2.01 15.06 2 14.7 2 12s.01-3.06.06-4.12c.05-1.06.22-1.79.47-2.43.26-.66.6-1.21 1.15-1.76A4.9 4.9 0 0 1 5.44 2.53c.64-.25 1.37-.42 2.43-.47C8.94 2.01 9.3 2 12 2zm0 5a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 8.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4zm5.2-8.4a1.17 1.17 0 1 1 0-2.34 1.17 1.17 0 0 1 0 2.34z"/></svg>
      </a>
      <a onclick="openLink('${telegramUrl}')">
        <svg viewBox="0 0 24 24"><path d="M21.8 4.4 3 11.4c-1 .4-1 1.7.1 2l4.6 1.5 1.8 5.6c.2.7 1.1.9 1.6.4l2.6-2.5 4.9 3.6c.7.5 1.7.1 1.9-.7l3.2-15c.2-.9-.7-1.6-1.5-1.3zM9 14.5l8.8-6.9c.3-.2.6.2.3.4L11 14.5l-.3 3.2z"/></svg>
      </a>
    `;
  }

  async function load() {
    const initData = (tg && tg.initData) || "";
    try {
      const res = await fetch("/api/me?initData=" + encodeURIComponent(initData));
      const data = await res.json();
      lastData = data;
      render(data);
    } catch (e) {
      document.getElementById("content").innerHTML =
        `<div class="empty">${t("loadError")}</div>`;
    }
  }

  function render(data) {
    const content = document.getElementById("content");
    const ann = document.getElementById("announcement");

    if (data.error === "auth_failed") {
      content.innerHTML = `<div class="empty">${t("openFromBot")}</div>`;
      return;
    }

    if (data.announcement) {
      ann.textContent = data.announcement;
      ann.style.display = "block";
    }

    if (!data.registered) {
      renderRegistrationForm();
      return;
    }

    renderFooterLinks(data.group_type);

    let subHtml;
    if (data.subscription) {
      const s = data.subscription;
      let visitsHtml = "";
      if (s.visits_total !== null && s.visits_total !== undefined) {
        visitsHtml = `
          <div class="label">${t("visitsLeft")}</div>
          <div class="value">${s.visits_left} ${t("of")} ${s.visits_total}</div>
        `;
      }
      subHtml = `
        <div class="label">${t("subscription")}</div>
        <div class="value">${esc(s.title)}</div>
        <div class="label">${t("validUntil")}</div>
        <div class="value">${s.end_date}</div>
        ${visitsHtml}
      `;
    } else {
      subHtml = `<div class="label">${t("subscription")}</div>
        <div class="status-badge status-none">${t("noSubscription")}</div>`;
    }

    const groupTag = data.group_type === 'kids'
      ? `<span class="group-tag">Kids</span>`
      : `<span class="group-tag">Adult</span>`;

    const actionBtn = data.subscription
      ? `<button class="secondary" onclick="openFreezeModal()">${t("freezeBtn")}</button>`
      : `<button class="outline-full" onclick="openActivateModal()">${t("activateBtn")}</button>`;

    content.innerHTML = `
      <div class="card id-card">
        <div class="name">${esc(data.full_name)}</div>
        ${groupTag}
        ${beltHtml(data)}
        ${subHtml}
        ${actionBtn}
      </div>
      ${attendanceHtml(data)}
      ${scheduleHtml(data.schedule)}
    `;
  }

  const BELT_COLORS = {
    white: "#F5F3EE", grey: "#8A8A8A", yellow: "#E3C02B", orange: "#DE7C2A",
    green: "#3F7D3A", blue: "#1F4FA8", purple: "#5B2E8C",
    brown: "#5C3A21", black: "#1A1A1A",
  };
  const BELT_NAMES = {
    ru: { white:"Белый", grey:"Серый", yellow:"Жёлтый", orange:"Оранжевый", green:"Зелёный",
          blue:"Синий", purple:"Фиолетовый", brown:"Коричневый", black:"Чёрный" },
    en: { white:"White", grey:"Grey", yellow:"Yellow", orange:"Orange", green:"Green",
          blue:"Blue", purple:"Purple", brown:"Brown", black:"Black" },
  };

  function beltHtml(data) {
    if (!data.belt) {
      return `<div class="label">${t("belt")}</div>
              <div class="status-badge status-none">${t("noBelt")}</div>`;
    }
    const color = BELT_COLORS[data.belt] || "#8A8A8A";
    const name = (BELT_NAMES[lang] && BELT_NAMES[lang][data.belt]) || data.belt;
    const stripes = Array.from({ length: data.stripes || 0 })
      .map(() => '<span class="belt-stripe"></span>').join("");
    const promo = data.belt_updated
      ? `<div class="sched-tag" style="margin-top:4px;">${t("lastPromo")}: ${esc(data.belt_updated)}</div>`
      : "";
    return `
      <div class="label">${t("belt")}</div>
      <div class="value">${esc(name)}${data.stripes ? ` · ${data.stripes} ${t("stripesWord")}` : ""}</div>
      <div class="belt-bar" style="background:${color};">${stripes}</div>
      ${promo}
    `;
  }

  function attendanceHtml(data) {
    const chips = (data.recent_visits || [])
      .map(d => `<span class="visit-chip">${esc(d)}</span>`).join("");
    return `
      <div class="section-title">${t("attendance")}</div>
      <div class="card">
        <div class="stat-row">
          <span class="stat-big">${data.visits_this_month || 0}</span>
          <span class="sched-tag">${t("visitsWord")} ${t("thisMonth")}</span>
        </div>
        ${chips ? `<div class="visit-chips">${chips}</div>`
                : `<div class="sched-tag" style="margin-top:8px;">${t("noVisits")}</div>`}
      </div>
    `;
  }

  function scheduleHtml(schedule) {
    if (!schedule || !schedule.length) {
      return `<div class="section-title">${t("schedule")}</div>
              <div class="card"><div class="sched-tag">${t("noSchedule")}</div></div>`;
    }
    // в JS воскресенье = 0, у нас понедельник = 0
    const todayIdx = (new Date().getDay() + 6) % 7;
    const byDay = {};
    schedule.forEach(s => {
      (byDay[s.day_of_week] = byDay[s.day_of_week] || []).push(s);
    });
    let html = `<div class="section-title">${t("schedule")}</div><div class="card">`;
    for (let d = 0; d < 7; d++) {
      if (!byDay[d]) continue;
      const isToday = d === todayIdx;
      html += `<div class="sched-day">${t("days")[d]}${isToday ? " •" : ""}</div>`;
      byDay[d].forEach(s => {
        const time = s.end_time ? `${s.start_time}–${s.end_time}` : s.start_time;
        const tag = s.group_type === "all" ? "" :
          `<span class="sched-tag">${s.group_type === "kids" ? "Kids" : "Adult"}</span>`;
        html += `
          <div class="sched-row ${isToday ? "today-row" : ""}">
            <span class="sched-time">${esc(time)}</span>
            <span class="sched-title">${esc(s.title)}</span>
            ${tag}
          </div>`;
      });
    }
    return html + "</div>";
  }

  let selectedGroup = null;

  function renderRegistrationForm() {
    const content = document.getElementById("content");
    content.innerHTML = `
      <div class="card">
        <div class="name" style="margin-bottom:14px;">${t("registration")}</div>
        <div class="label">${t("chooseGroup")}</div>
        <div class="group-choice">
          <div class="group-btn" id="grpAdult" onclick="pickGroup('adult')">Adult</div>
          <div class="group-btn" id="grpKids" onclick="pickGroup('kids')">Kids</div>
        </div>
        <div class="label" id="nameLabel">${t("nameLabel")}</div>
        <input id="regName" placeholder="${t("namePlaceholder")}">
        <div class="label">${t("birthDate")}</div>
        <input id="regBirth" type="date">
        <button class="primary-full" onclick="submitRegistration()">${t("registerBtn")}</button>
      </div>
    `;
  }

  function pickGroup(group) {
    selectedGroup = group;
    document.getElementById("grpAdult").classList.toggle("selected", group === "adult");
    document.getElementById("grpKids").classList.toggle("selected", group === "kids");
    document.getElementById("nameLabel").textContent =
      group === "kids" ? t("nameLabelKids") : t("nameLabel");
  }

  async function submitRegistration() {
    if (!selectedGroup) {
      alert(t("chooseGroupAlert"));
      return;
    }
    const full_name = document.getElementById("regName").value.trim();
    const birth_date = document.getElementById("regBirth").value;
    if (full_name.length < 2) {
      alert(t("enterNameAlert"));
      return;
    }
    if (!birth_date) {
      alert(t("enterBirthAlert"));
      return;
    }
    const initData = (tg && tg.initData) || "";
    try {
      const res = await fetch("/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ initData, full_name, group_type: selectedGroup, birth_date }),
      });
      const data = await res.json();
      if (data.ok) {
        tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success");
        load();
      } else {
        alert(t("registerFail"));
      }
    } catch (e) {
      alert(t("networkError"));
    }
  }

  function openFreezeModal() {
    document.getElementById("freezeModalBg").style.display = "flex";
  }
  document.getElementById("freezeModalBg").addEventListener("click", (e) => {
    if (e.target.id === "freezeModalBg") document.getElementById("freezeModalBg").style.display = "none";
  });

  async function submitFreeze() {
    const days = document.getElementById("freezeDays").value;
    const initData = (tg && tg.initData) || "";
    try {
      const res = await fetch("/api/freeze_request", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ initData, days }),
      });
      const data = await res.json();
      document.getElementById("freezeModalBg").style.display = "none";
      if (data.ok) {
        tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success");
        alert(t("freezeSent"));
      } else if (data.error === "already_pending") {
        alert(t("alreadyPending"));
      } else {
        alert(t("freezeFail"));
      }
    } catch (e) {
      alert(t("networkError"));
    }
  }

  function openActivateModal() {
    document.getElementById("activateDate").value = new Date().toISOString().slice(0, 10);
    document.getElementById("activateModalBg").style.display = "flex";
  }
  document.getElementById("activateModalBg").addEventListener("click", (e) => {
    if (e.target.id === "activateModalBg") document.getElementById("activateModalBg").style.display = "none";
  });

  async function submitActivation() {
    const requested_date = document.getElementById("activateDate").value;
    const initData = (tg && tg.initData) || "";
    try {
      const res = await fetch("/api/activate_request", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ initData, requested_date }),
      });
      const data = await res.json();
      document.getElementById("activateModalBg").style.display = "none";
      if (data.ok) {
        tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success");
        alert(t("activateSent"));
      } else if (data.error === "already_pending") {
        alert(t("alreadyPending"));
      } else {
        alert(t("activateFail"));
      }
    } catch (e) {
      alert(t("networkError"));
    }
  }

  setLang(lang);
  load();
</script>

</body>
</html>
