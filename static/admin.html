<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universal Jiu-Jitsu Batumi — Coach Panel</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0A0A0A;
    --paper: #161616;
    --paper-line: #2B2B2B;
    --red: #A31515;
    --red-bright: #D01F1F;
    --bone: #F5F3EE;
    --ash: #8C8C86;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 18px 16px 32px;
    background: var(--ink);
    color: var(--bone);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h2 {
    font-family: 'Oswald', sans-serif;
    font-size: 19px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    margin: 20px 0 12px;
  }
  .tabs {
    display: flex;
    gap: 22px;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--paper-line);
  }
  .tab {
    padding: 4px 0 12px;
    color: var(--ash);
    font-weight: 600;
    font-size: 14px;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab.active { color: var(--red); border-color: var(--red); }
  .card {
    background: var(--paper);
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    padding: 15px 16px;
    margin-bottom: 10px;
  }
  .client-name {
    font-family: 'Oswald', sans-serif;
    font-size: 17px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.01em;
  }
  .client-sub { color: var(--ash); font-size: 13px; margin-top: 4px; }
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 3px;
    font-size: 12px;
    font-weight: 600;
    margin-top: 7px;
  }
  .status-badge::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
  }
  .status-active { background: rgba(245,243,238,0.1); color: var(--bone); }
  .status-overdue { background: rgba(208,31,31,0.18); color: var(--red-bright); }
  .status-none { background: rgba(140,140,134,0.18); color: var(--ash); }
  button.primary {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 3px;
    background: var(--red);
    color: var(--bone);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin-top: 10px;
  }
  button.primary:active { background: #7F1010; }
  input, textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: 3px;
    border: 1px solid var(--paper-line);
    background: var(--ink);
    color: var(--bone);
    font-size: 15px;
    margin-top: 6px;
    font-family: inherit;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--red); }
  .label { color: var(--ash); font-size: 13px; margin-top: 12px; }
  .modal-bg {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    align-items: flex-end;
    justify-content: center;
    z-index: 10;
  }
  .modal {
    background: var(--paper);
    border-top: 1px solid var(--paper-line);
    width: 100%;
    max-width: 480px;
    border-radius: 10px 10px 0 0;
    padding: 22px 20px;
  }
  .empty { text-align: center; color: var(--ash); padding: 44px 20px; font-size: 14px; line-height: 1.5; }
  .subtabs {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
  }
  .subtab {
    flex: 1;
    text-align: center;
    padding: 8px;
    border-radius: 3px;
    background: transparent;
    border: 1px solid var(--paper-line);
    color: var(--ash);
    font-size: 13px;
    font-weight: 600;
  }
  .subtab.active { background: var(--red); color: var(--bone); border-color: var(--red); }
  .badge-count {
    display: inline-block;
    background: var(--red-bright);
    color: var(--bone);
    border-radius: 10px;
    padding: 1px 7px;
    font-size: 11px;
    margin-left: 4px;
    font-family: -apple-system, sans-serif;
  }
  .row-buttons { display: flex; gap: 8px; margin-top: 8px; }
  .row-buttons button { flex: 1; margin-top: 0; }
  button.small-secondary {
    padding: 10px;
    border: 1px solid var(--paper-line);
    border-radius: 3px;
    background: transparent;
    color: var(--bone);
    font-size: 13px;
    font-weight: 600;
  }
  button.small-secondary:active { background: var(--paper-line); }
  button.small-danger {
    padding: 10px;
    border: 1px solid rgba(208,31,31,0.35);
    border-radius: 3px;
    background: rgba(208,31,31,0.1);
    color: var(--red-bright);
    font-size: 13px;
    font-weight: 600;
  }
  .coach-banner {
    text-align: center;
    margin-bottom: 18px;
  }
  .coach-banner .club {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ash);
  }
  .coach-banner .club span { color: var(--red-bright); }
  .coach-banner .bar {
    width: 36px;
    height: 2px;
    background: var(--red);
    margin: 6px auto 0;
  }
</style>
</head>
<body>

<div class="coach-banner">
  <div class="club">UNIVERSAL JIU-JITSU <span>BATUMI</span></div>
  <div class="bar"></div>
</div>

<div class="tabs">
  <div class="tab active" id="tabClients" onclick="showTab('clients')">Клиенты</div>
  <div class="tab" id="tabFreeze" onclick="showTab('freeze')">Заморозки<span id="freezeBadge"></span></div>
  <div class="tab" id="tabAnn" onclick="showTab('announcement')">Объявление</div>
</div>

<div id="clientsView">
  <div class="subtabs">
    <div class="subtab active" id="subAll" onclick="setGroup(null)">Все</div>
    <div class="subtab" id="subAdult" onclick="setGroup('adult')">Adult</div>
    <div class="subtab" id="subKids" onclick="setGroup('kids')">Kids</div>
  </div>
  <input id="searchInput" placeholder="🔍 Поиск по имени или фамилии" oninput="renderClients()" style="margin-bottom:10px;">
  <div class="subtabs">
    <div class="subtab active" id="sortAlpha" onclick="setSort('alpha')">А-Я</div>
    <div class="subtab" id="sortBirth" onclick="setSort('birth')">По дате рождения</div>
  </div>
  <div id="clientsList"><div class="empty">Загрузка…</div></div>
</div>

<div id="freezeView" style="display:none;">
  <div id="freezeList"><div class="empty">Загрузка…</div></div>
</div>

<div id="announcementView" style="display:none;">
  <div class="label">Текст объявления для всех клиентов</div>
  <textarea id="annText" rows="4" placeholder="Например: 20 сентября зал закрыт"></textarea>
  <button class="primary" onclick="saveAnnouncement()">Сохранить</button>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2 id="modalClientName">Отметить оплату</h2>
    <div class="label">Название абонемента</div>
    <input id="mTitle" value="Абонемент">
    <div class="label">Дата оплаты</div>
    <input id="mDate" type="date">
    <div class="label">Срок (месяцев)</div>
    <input id="mMonths" type="number" value="1" min="1">
    <div class="label">Посещений (необязательно)</div>
    <input id="mVisits" type="number" placeholder="оставить пустым если безлимит">
    <button class="primary" onclick="submitPayment()">Сохранить оплату</button>
  </div>
</div>

<div class="modal-bg" id="editModalBg">
  <div class="modal">
    <h2>Редактировать имя</h2>
    <input id="eName" placeholder="Имя и фамилия">
    <button class="primary" onclick="submitEdit()">Сохранить</button>
  </div>
</div>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    try { tg.ready(); tg.expand(); } catch (e) {}
  }
  const initData = (tg && tg.initData) || "";

  let currentClientId = null;
  let currentGroup = null;
  let currentSort = "alpha";
  let allClients = [];

  function showTab(tab) {
    document.getElementById("tabClients").classList.toggle("active", tab === "clients");
    document.getElementById("tabFreeze").classList.toggle("active", tab === "freeze");
    document.getElementById("tabAnn").classList.toggle("active", tab === "announcement");
    document.getElementById("clientsView").style.display = tab === "clients" ? "block" : "none";
    document.getElementById("freezeView").style.display = tab === "freeze" ? "block" : "none";
    document.getElementById("announcementView").style.display = tab === "announcement" ? "block" : "none";
    if (tab === "announcement") loadAnnouncement();
    if (tab === "freeze") loadFreezeRequests();
  }

  function setGroup(group) {
    currentGroup = group;
    document.getElementById("subAll").classList.toggle("active", group === null);
    document.getElementById("subAdult").classList.toggle("active", group === "adult");
    document.getElementById("subKids").classList.toggle("active", group === "kids");
    loadClients();
  }

  function setSort(sort) {
    currentSort = sort;
    document.getElementById("sortAlpha").classList.toggle("active", sort === "alpha");
    document.getElementById("sortBirth").classList.toggle("active", sort === "birth");
    renderClients();
  }

  async function loadClients() {
    const q = currentGroup ? "&group=" + currentGroup : "";
    const res = await fetch("/api/admin/clients?initData=" + encodeURIComponent(initData) + q);
    const data = await res.json();

    if (data.error) {
      document.getElementById("clientsList").innerHTML =
        '<div class="empty">Нет доступа. Эта панель только для тренера.</div>';
      return;
    }
    allClients = data.clients;
    renderClients();
  }

  function renderClients() {
    const view = document.getElementById("clientsList");
    const searchTerm = (document.getElementById("searchInput").value || "").toLowerCase().trim();

    let list = allClients.filter(c => c.full_name.toLowerCase().includes(searchTerm));

    if (currentSort === "birth") {
      list = list.slice().sort((a, b) => {
        if (!a.birth_date) return 1;
        if (!b.birth_date) return -1;
        return a.birth_date.localeCompare(b.birth_date);
      });
    } else {
      list = list.slice().sort((a, b) => a.full_name.localeCompare(b.full_name, "ru"));
    }

    if (!allClients.length) {
      view.innerHTML = '<div class="empty">Клиентов пока нет.<br>Попросите их написать боту /start.</div>';
      return;
    }
    if (!list.length) {
      view.innerHTML = '<div class="empty">Никого не найдено по этому запросу.</div>';
      return;
    }

    view.innerHTML = list.map(c => {
      let badge = '<span class="status-badge status-none">Нет абонемента</span>';
      let subInfo = "";
      if (c.status === "active") {
        badge = `<span class="status-badge status-active">До ${c.sub_end_date}</span>`;
      } else if (c.status === "overdue") {
        badge = `<span class="status-badge status-overdue">Просрочен: ${c.sub_end_date}</span>`;
      }
      const groupLabel = c.group_type === 'kids' ? 'Kids' : 'Adult';
      const birthLabel = c.birth_date ? ` · д.р. ${c.birth_date.split('-').reverse().join('.')}` : '';
      if (c.sub_title) {
        subInfo = `<div class="client-sub">${c.sub_title} · ${groupLabel}${birthLabel}</div>`;
      } else {
        subInfo = `<div class="client-sub">${groupLabel}${birthLabel}</div>`;
      }
      const safeName = c.full_name.replace(/'/g, "\\'");
      return `
        <div class="card">
          <div class="client-name">${c.full_name}</div>
          ${subInfo}
          <div>${badge}</div>
          <button class="primary" onclick="openModal(${c.id}, '${safeName}')">Отметить оплату</button>
          <div class="row-buttons">
            <button class="small-secondary" onclick="openEditModal(${c.id}, '${safeName}')">✏️ Изменить имя</button>
            <button class="small-danger" onclick="deleteClient(${c.id}, '${safeName}')">🗑 Удалить</button>
          </div>
        </div>
      `;
    }).join("");
  }

  function openModal(clientId, name) {
    currentClientId = clientId;
    document.getElementById("modalClientName").textContent = "Оплата: " + name;
    document.getElementById("mDate").value = new Date().toISOString().slice(0, 10);
    document.getElementById("modalBg").style.display = "flex";
  }
  document.getElementById("modalBg").addEventListener("click", (e) => {
    if (e.target.id === "modalBg") document.getElementById("modalBg").style.display = "none";
  });

  function openEditModal(clientId, name) {
    currentClientId = clientId;
    document.getElementById("eName").value = name;
    document.getElementById("editModalBg").style.display = "flex";
  }
  document.getElementById("editModalBg").addEventListener("click", (e) => {
    if (e.target.id === "editModalBg") document.getElementById("editModalBg").style.display = "none";
  });

  async function submitEdit() {
    const full_name = document.getElementById("eName").value;
    const res = await fetch("/api/admin/edit_client", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData, client_id: currentClientId, full_name }),
    });
    const data = await res.json();
    if (data.ok) {
      document.getElementById("editModalBg").style.display = "none";
      loadClients();
    } else {
      alert("Ошибка: " + (data.error || "неизвестная"));
    }
  }

  async function deleteClient(clientId, name) {
    if (!confirm(`Удалить ${name} из базы? Это действие необратимо.`)) return;
    const res = await fetch("/api/admin/delete_client", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData, client_id: clientId }),
    });
    const data = await res.json();
    if (data.ok) {
      loadClients();
    } else {
      alert("Ошибка: " + (data.error || "неизвестная"));
    }
  }

  async function submitPayment() {
    const body = {
      initData,
      client_id: currentClientId,
      title: document.getElementById("mTitle").value || "Абонемент",
      payment_date: document.getElementById("mDate").value,
      months: document.getElementById("mMonths").value || 1,
      visits: document.getElementById("mVisits").value,
    };
    const res = await fetch("/api/admin/mark_payment", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (data.ok) {
      document.getElementById("modalBg").style.display = "none";
      tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success");
      loadClients();
    } else {
      alert("Ошибка: " + (data.error || "неизвестная"));
    }
  }

  async function loadFreezeRequests() {
    const res = await fetch("/api/admin/freeze_requests?initData=" + encodeURIComponent(initData));
    const data = await res.json();
    const view = document.getElementById("freezeList");
    const badge = document.getElementById("freezeBadge");

    if (data.error) {
      view.innerHTML = '<div class="empty">Нет доступа.</div>';
      return;
    }
    if (!data.requests.length) {
      view.innerHTML = '<div class="empty">Нет активных заявок на заморозку.</div>';
      badge.innerHTML = "";
      return;
    }
    badge.innerHTML = `<span class="badge-count">${data.requests.length}</span>`;
    view.innerHTML = data.requests.map(r => `
      <div class="card">
        <div class="client-name">${r.full_name}</div>
        <div class="client-sub">Просит заморозку на ${r.days_requested} дн. · заявка от ${r.created_at}</div>
        <div class="row-buttons">
          <button class="primary" style="background:var(--bone);color:var(--bone);" onclick="decideFreeze(${r.id}, true)">✅ Одобрить</button>
          <button class="small-danger" onclick="decideFreeze(${r.id}, false)">❌ Отклонить</button>
        </div>
      </div>
    `).join("");
  }

  async function decideFreeze(requestId, approve) {
    const res = await fetch("/api/admin/freeze_decision", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData, request_id: requestId, approve }),
    });
    const data = await res.json();
    if (data.ok) {
      tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success");
      loadFreezeRequests();
    } else {
      alert("Ошибка: " + (data.error || "неизвестная"));
    }
  }

  async function loadAnnouncement() {
    const res = await fetch("/api/admin/announcement?initData=" + encodeURIComponent(initData));
    const data = await res.json();
    document.getElementById("annText").value = data.text || "";
  }

  async function saveAnnouncement() {
    const text = document.getElementById("annText").value;
    const res = await fetch("/api/admin/announcement", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData, text }),
    });
    const data = await res.json();
    if (data.ok) {
      tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success");
      alert("Сохранено");
    }
  }

  loadClients();
  loadFreezeRequests();
</script>

</body>
</html>
